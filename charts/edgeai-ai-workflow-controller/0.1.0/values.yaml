# ai-workflow-controller — Edge AI 平台預設值
# 由 tools/edgeai/build.py 依 tools/edgeai/catalog.yaml 產生；請改 catalog 後重產。
# 密碼／金鑰一律用 Secret（existingSecret 類參數），不要寫進 values。
nameOverride: ''
fullnameOverride: ''
imagePullSecrets: []
podSecurityContext: {}
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
networkPolicy:
  enabled: true
  allowedPorts: []
  allowFrom: []
ingress:
  enabled: false
  className: ''
  host: ''
  tlsSecret: ''
  annotations: {}
  component: ''
  servicePort: ''
existingSecret: ''
serviceAccount:
  create: true
  name: ''
rbac:
  create: true
  clusterWide: false
  rules:
  - apiGroups:
    - vision.edgeai.internal
    resources:
    - visionpipelines
    - visionpipelines/status
    verbs:
    - get
    - list
    - watch
    - update
    - patch
  - apiGroups:
    - apps
    resources:
    - deployments
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
  - apiGroups:
    - ''
    resources:
    - configmaps
    - secrets
    - events
    verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
workflow:
  mediamtxApi: http://edgeai-mediamtx-mediamtx.edgeai-vision.svc:9997
  tritonUrl: edgeai-triton-triton.edgeai-vision.svc:8001
  vlmUrl: http://edgeai-vllm-router-service.edgeai-rag.svc/v1
  vlmMaxConcurrent: 2
workers:
  ds:
    repository: ''
    tag: ''
  gst:
    repository: ''
    tag: ''
components:
  app:
    enabled: true
    replicas: 1
    image:
      repository: ''
      tag: ''
      pullPolicy: IfNotPresent
    env:
    - name: EDGEAI_CONFIG
      value: /etc/edgeai/config.yaml
    envFrom:
    - secretRef:
        name: '{{ .Values.existingSecret | default (printf "%s-secrets" (include "eai.fullname" .)) }}'
        optional: true
    ports:
    - name: http
      containerPort: 8080
    - name: metrics
      containerPort: 9090
    service:
      enabled: true
      type: ClusterIP
      ports:
      - name: http
        port: 8080
      - name: metrics
        port: 9090
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 10
      periodSeconds: 20
    readinessProbe:
      httpGet:
        path: /readyz
        port: http
      periodSeconds: 10
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    config:
      mountPath: /etc/edgeai
      files:
        config.yaml: |
          media:
            mediamtxApi: {{ .Values.workflow.mediamtxApi | quote }}
          inference:
            triton: {{ .Values.workflow.tritonUrl | quote }}
            vlm: {{ .Values.workflow.vlmUrl | quote }}
            vlmBudget: {maxConcurrent: {{ .Values.workflow.vlmMaxConcurrent }}}
          workers:
            dsImage: "{{ .Values.workers.ds.repository }}:{{ .Values.workers.ds.tag }}"     # DeepStream（Jetson）
            gstImage: "{{ .Values.workers.gst.repository }}:{{ .Values.workers.gst.tag }}"   # GStreamer＋Triton client（通用）
