nameOverride: ""
fullnameOverride: ""

namespaceOverride: ""

image:
  repository: loganjindev/zerotier-ztncui
  tag: latest
  pullPolicy: IfNotPresent

podAnnotations: {}
podLabels: {}

# Single-node default: do not bind to a hostname unless you want to pin this pod.
nodeSelector: {}

affinity: {}
tolerations: []

network:
  # Host NIC used by macvlan on the single Kubernetes node
  masterInterface: ens20

securityContext:
  runAsUser: 0
  privileged: true
  capabilities:
    add:
      - NET_ADMIN

multus:
  enabled: true
  nadName: macvlan-conf
  interface: net1
  ip: 192.168.101.150
  cidr: 24
  gateway: 192.168.101.1
  defaultRoute: true

networkAttachmentDefinition:
  create: true
  name: macvlan-conf
  master: ""
  mode: bridge
  subnet: 192.168.101.0/24
  rangeStart: 192.168.101.150
  rangeEnd: 192.168.101.160
  gateway: 192.168.101.1
  routes:
    - dst: 0.0.0.0/0
      gw: 192.168.101.1

dnsConfig:
  enabled: true
  nameservers:
    - 8.8.8.8

env:
  HTTP_PORT: "3000"
  HTTPS_PORT: "3443"
  HTTP_ALL_INTERFACES: "yes"
  MYADDR: "192.168.101.150"
  MYDOMAIN: "zerotier.example.internal"

secret:
  create: true
  name: zerotier-planet-secret
  ztncuiPassword: "P@ssw0rd"
  existingSecret: ""
  existingSecretKey: ZTNCUI_PASSWD

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  ports:
    httpUi:
      port: 3000
      targetPort: 3000
      protocol: TCP
    httpsUi:
      port: 3443
      targetPort: 3443
      protocol: TCP
    fileHttp:
      port: 3180
      targetPort: 3180
      protocol: TCP
    ztTcp:
      port: 9993
      targetPort: 9993
      protocol: TCP
    ztUdp:
      port: 9993
      targetPort: 9993
      protocol: UDP

persistence:
  zerotierOne:
    enabled: true
    existingClaim: ""
    claimName: zerotier-one-pvc
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    storageClassName: ""
  ztncuiEtc:
    enabled: true
    existingClaim: ""
    claimName: ztncui-etc-pvc
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClassName: ""

resources: {}

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
