# sim-aaa-adapter — Edge AI 平台預設值
# 由 tools/edgeai/build.py 依 tools/edgeai/catalog.yaml 產生；請改 catalog 後重產。
# 密碼／金鑰一律用 Secret（existingSecret 類參數），不要寫進 values。
nameOverride: ''
fullnameOverride: ''
imagePullSecrets: []
podSecurityContext: {}
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
networkPolicy:
  enabled: true
  allowedPorts:
  - port: 8080
  allowFrom:
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: edgeai-access
    podSelector:
      matchLabels:
        app.kubernetes.io/name: edgeai-freeradius
ingress:
  enabled: false
  className: ''
  host: ''
  tlsSecret: ''
  annotations: {}
  component: ''
  servicePort: ''
existingSecret: ''
serviceAccount:
  create: true
  name: ''
rbac:
  create: false
  clusterWide: false
  rules: []
adapter:
  anid: WLAN
  mcc: '001'
  mnc: '01'
  avPrefetch: 5
  udmUrl: https://udm.example.internal
  redisUrl: redis://edgeai-valkey.edgeai-platform.svc:6379
  requestTimeoutMs: 1000
components:
  app:
    enabled: true
    replicas: 2
    image:
      repository: ''
      tag: ''
      pullPolicy: IfNotPresent
    env:
    - name: EDGEAI_CONFIG
      value: /etc/edgeai/config.yaml
    envFrom:
    - secretRef:
        name: '{{ .Values.existingSecret | default (printf "%s-secrets" (include "eai.fullname" .)) }}'
        optional: true
    ports:
    - name: http
      containerPort: 8080
    - name: metrics
      containerPort: 9090
    service:
      enabled: true
      type: ClusterIP
      ports:
      - name: http
        port: 8080
      - name: metrics
        port: 9090
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 10
      periodSeconds: 20
    readinessProbe:
      httpGet:
        path: /readyz
        port: http
      periodSeconds: 10
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    config:
      mountPath: /etc/edgeai
      files:
        config.yaml: |
          # sim-aaa-adapter 設定（金鑰材料不在這裡：Ki/OPc 永不經手；UDM 憑證與 token 走 Secret）
          eapAka:
            anid: {{ .Values.adapter.anid | quote }}
            realm: "wlan.mnc{{ printf "%03s" .Values.adapter.mnc }}.mcc{{ .Values.adapter.mcc }}.3gppnetwork.org"
            avPrefetch: {{ .Values.adapter.avPrefetch }}
          udm:
            url: {{ .Values.adapter.udmUrl | quote }}
            timeoutMs: {{ .Values.adapter.requestTimeoutMs }}
          cache:
            redisUrl: {{ .Values.adapter.redisUrl | quote }}
