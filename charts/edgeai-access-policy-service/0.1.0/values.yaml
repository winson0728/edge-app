# access-policy-service — Edge AI 平台預設值
# 由 tools/edgeai/build.py 依 tools/edgeai/catalog.yaml 產生；請改 catalog 後重產。
# 密碼／金鑰一律用 Secret（existingSecret 類參數），不要寫進 values。
nameOverride: ''
fullnameOverride: ''
imagePullSecrets: []
podSecurityContext: {}
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
networkPolicy:
  enabled: true
  allowedPorts:
  - port: 8080
  allowFrom:
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: edgeai-access
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: edgeai-platform
ingress:
  enabled: false
  className: ''
  host: ''
  tlsSecret: ''
  annotations: {}
  component: ''
  servicePort: ''
existingSecret: ''
serviceAccount:
  create: true
  name: ''
rbac:
  create: false
  clusterWide: false
  rules: []
policy:
  failMode: close
  quarantineVlan: '999'
  databaseHost: pg-rw.edgeai-platform.svc
  mosquittoDynsecUrl: mqtt://edgeai-mosquitto-mosquitto.edgeai-iot.svc:1883
  keycloakUrl: http://edgeai-keycloak-http.edgeai-access.svc
components:
  app:
    enabled: true
    replicas: 2
    image:
      repository: ''
      tag: ''
      pullPolicy: IfNotPresent
    env:
    - name: EDGEAI_CONFIG
      value: /etc/edgeai/config.yaml
    envFrom:
    - secretRef:
        name: '{{ .Values.existingSecret | default (printf "%s-secrets" (include "eai.fullname" .)) }}'
        optional: true
    ports:
    - name: http
      containerPort: 8080
    - name: metrics
      containerPort: 9090
    service:
      enabled: true
      type: ClusterIP
      ports:
      - name: http
        port: 8080
      - name: metrics
        port: 9090
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 10
      periodSeconds: 20
    readinessProbe:
      httpGet:
        path: /readyz
        port: http
      periodSeconds: 10
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    config:
      mountPath: /etc/edgeai
      files:
        config.yaml: |
          decision:
            failMode: {{ .Values.policy.failMode }}        # close＝不可達時 FreeRADIUS 丟隔離 VLAN
            quarantineVlan: {{ .Values.policy.quarantineVlan | quote }}
          database:
            host: {{ .Values.policy.databaseHost | quote }}  # 帳密走 Secret：DB_USER／DB_PASSWORD
          downstream:
            mosquittoDynsec: {{ .Values.policy.mosquittoDynsecUrl | quote }}
            keycloak: {{ .Values.policy.keycloakUrl | quote }}
          coa:
            port: 3799
