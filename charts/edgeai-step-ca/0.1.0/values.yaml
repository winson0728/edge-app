# step-ca 私有 CA — Edge AI 平台預設值
# 由 tools/edgeai/build.py 依 tools/edgeai/catalog.yaml 產生；請改 catalog 後重產。
# 上游 chart：step-certificates 1.30.1（https://smallstep.github.io/helm-charts）。
# 所有上游參數都放在 `step-certificates:` 底下，可用上游文件的任何參數覆寫。
# 密碼／金鑰一律用 Secret（existingSecret 類參數），不要寫進 values。
step-certificates:
  ca:
    name: Edge AI Private CA
    db:
      persistent: true
      size: 2Gi
