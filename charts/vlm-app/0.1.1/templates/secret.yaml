{{- if not .Values.admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vlm-app.fullname" . }}-admin
  labels:
    {{- include "vlm-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  VLM_ADMIN_USER: {{ .Values.admin.user | quote }}
  VLM_ADMIN_PASS: {{ required "set admin.password (or admin.existingSecret): the chart ships no default password" .Values.admin.password | quote }}
{{- end }}
