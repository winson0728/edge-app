# ── VLM-APP Helm values (k3s / RKE2 edge node with an NVIDIA GPU) ──────

# The image is not published: build it and load it into the node's containerd
# (see README), then set the tag you loaded. pullPolicy Never = use the local image only.
image:
  repository: vlm-app
  tag: latest
  pullPolicy: Never

# GPU access. On k3s install the NVIDIA container runtime + device plugin.
gpu:
  # runtimeClassName exposes the GPU to the pod. Leave "nvidia" if you set the
  # nvidia runtime as a RuntimeClass; set "" to disable (CPU-only).
  runtimeClassName: "nvidia"
  # exclusive=true → pod requests `nvidia.com/gpu: 1`. REQUIRED on clusters with
  # the NVIDIA device plugin / GPU Operator (the standard k8s GPU setup): without
  # a request the pod gets NO GPU even with runtimeClassName set. To SHARE one
  # physical GPU with the ollama pod, enable device-plugin time-slicing (it then
  # advertises >1 nvidia.com/gpu) and both request 1. Set false only on a bare
  # nvidia-container-runtime (no device plugin) that injects GPUs via env.
  exclusive: true

# First-run admin. The chart has no default password; give admin.password at install time,
# or point admin.existingSecret at a Secret you created.
admin:
  user: admin
  password: ""
  existingSecret: ""        # name of a Secret with keys VLM_ADMIN_USER / VLM_ADMIN_PASS

env:
  VLM_HW_ACCEL: "auto"      # auto | off  (auto uses cuvid if ffmpeg has it)
  VLM_DISPLAY_FPS: "15"
  VLM_SESSION_TTL_SEC: "43200"
  VLM_CAPTURE_STALE_SEC: "60"

service:
  web:
    type: ClusterIP         # expose via ingress; use NodePort/LoadBalancer to skip ingress
    port: 8000
    nodePort: ""            # set when type=NodePort
  mqtt:
    enabled: true           # embedded MQTT broker for signal lights
    type: NodePort          # signal-light devices connect from the LAN
    port: 1883
    nodePort: 31883

ingress:
  enabled: true
  className: "traefik"       # k3s default ingress
  host: "vlm.local"
  annotations: {}

# Persistent data (DB, media, backups, cameras.json, snapshots, clips) — all
# under VLM_DATA_DIR=/data on one PVC. k3s ships the local-path provisioner.
persistence:
  enabled: true
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  size: 20Gi

resources: {}
  # limits: { memory: 8Gi }
  # requests: { cpu: "2", memory: 4Gi }

# Shared memory (/dev/shm) — the k8s equivalent of `docker run --ipc=host`.
# torch/ultralytics need more than the 64Mi default. Backed by RAM (counts
# against the pod's memory).
shm:
  enabled: true
  size: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

# ── Ollama (the VLM engine) as a pod in the same release ──────────────
# Runs Ollama next to vlm-app on the same node. Disable to point at an
# external Ollama (e.g. one installed on the host) instead.
ollama:
  enabled: true
  image: ollama/ollama:latest
  # Optional model to pull on first start (leave "" to pull manually later).
  pullModel: "ministral-3:8b"
  service:
    port: 11434
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 60Gi              # VLM weights are large
  resources: {}

# When ollama.enabled=false, point vlm-app at your external Ollama:
externalOllamaUrl: ""       # e.g. http://<ollama-host>:11434
