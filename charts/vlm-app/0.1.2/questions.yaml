# Rancher UI install form (Apps → Charts → vlm-app).
questions:
  - variable: image.platform
    label: Platform
    description: "Image tag becomes <platform>-<appVersion>, e.g. arm64-thor-v92.3. The image must already be loaded on the node (pullPolicy Never)."
    type: enum
    options: [arm64-thor, x86-rtx50]
    default: arm64-thor
    group: Image
  - variable: image.tag
    label: Image tag override
    description: "Leave empty to use <platform>-<appVersion>"
    type: string
    required: false
    default: ""
    group: Image
  - variable: admin.password
    label: Admin password
    description: "First-run admin password (no default)"
    type: password
    required: true
    group: Admin
  - variable: ollama.enabled
    label: Run Ollama as a pod
    type: boolean
    default: false
    group: Ollama
    show_subquestion_if: false
    subquestions:
      - variable: externalOllamaUrl
        label: External Ollama URL
        description: "e.g. http://<ollama-host>:11434. Leave empty to keep the URL set in the app (web UI / cameras.json)."
        type: string
        required: false
  - variable: service.web.type
    label: Web service type
    type: enum
    options: [ClusterIP, NodePort]
    default: NodePort
    group: Network
    show_subquestion_if: NodePort
    subquestions:
      - variable: service.web.nodePort
        label: Web NodePort
        type: int
        default: 30085
        min: 30000
        max: 32767
  - variable: ingress.enabled
    label: Create an Ingress
    type: boolean
    default: false
    group: Network
  - variable: gpu.exclusive
    label: Request nvidia.com/gpu
    type: boolean
    default: true
    group: GPU
