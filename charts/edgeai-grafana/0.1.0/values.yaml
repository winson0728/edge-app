# Grafana（AGPL） — Edge AI 平台預設值
# 由 tools/edgeai/build.py 依 tools/edgeai/catalog.yaml 產生；請改 catalog 後重產。
# 上游 chart：grafana 10.5.15（https://grafana.github.io/helm-charts）。
# 所有上游參數都放在 `grafana:` 底下，可用上游文件的任何參數覆寫。
# 密碼／金鑰一律用 Secret（existingSecret 類參數），不要寫進 values。
grafana:
  admin:
    existingSecret: ''
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
