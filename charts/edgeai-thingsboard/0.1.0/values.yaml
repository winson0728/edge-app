# ThingsBoard CE（選配） — Edge AI 平台預設值
# 由 tools/edgeai/build.py 依 tools/edgeai/catalog.yaml 產生；請改 catalog 後重產。
# 密碼／金鑰一律用 Secret（existingSecret 類參數），不要寫進 values。
nameOverride: ''
fullnameOverride: ''
imagePullSecrets: []
podSecurityContext:
  fsGroup: 799
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
networkPolicy:
  enabled: true
  allowedPorts:
  - port: 9090
  - port: 1883
  - port: 7070
  - port: 5683
    protocol: UDP
  allowFrom: []
ingress:
  enabled: false
  className: ''
  host: ''
  tlsSecret: ''
  annotations: {}
  component: thingsboard
  servicePort: http
components:
  thingsboard:
    enabled: true
    kind: StatefulSet
    image:
      repository: docker.io/thingsboard/tb-postgres
      tag: 4.2.1
      pullPolicy: IfNotPresent
    env:
    - name: TB_QUEUE_TYPE
      value: in-memory
    ports:
    - name: http
      containerPort: 9090
    - name: mqtt
      containerPort: 1883
    - name: edge-rpc
      containerPort: 7070
    - name: coap
      containerPort: 5683
      protocol: UDP
    service:
      enabled: true
      type: ClusterIP
      ports:
      - name: http
        port: 9090
      - name: mqtt
        port: 1883
      - name: edge-rpc
        port: 7070
      - name: coap
        port: 5683
        protocol: UDP
    startupProbe:
      tcpSocket:
        port: http
      periodSeconds: 10
      failureThreshold: 60
    readinessProbe:
      tcpSocket:
        port: http
      periodSeconds: 10
    persistence:
      enabled: true
      mountPath: /data
      size: 10Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 3Gi
