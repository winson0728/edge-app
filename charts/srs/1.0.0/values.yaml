replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ossrs/srs
  tag: "6"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer

  tcp:
    rtmp: 1935
    api: 1985
    http: 8080

  udp:
    webrtc: 8000
    srt: 10080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: srs.example.com
  path: /
  pathType: Prefix
  tls: false
  tlsSecretName: ""

resources: {}
# resources:
#   limits:
#     cpu: "1000m"
#     memory: "1Gi"
#   requests:
#     cpu: "250m"
#     memory: "256Mi"

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}

securityContext: {}
podSecurityContext: {}

persistence:
  enabled: false
  size: 5Gi
  storageClass: ""

config:
  candidate: ""
  content: |
    listen              1935;
    max_connections     1000;
    daemon              off;
    srs_log_tank        console;

    http_api {
        enabled         on;
        listen          1985;
    }

    http_server {
        enabled         on;
        listen          8080;
        dir             ./objs/nginx/html;
    }

    rtc_server {
        enabled on;
        listen 8000;
        candidate __CANDIDATE__;
    }

    srt_server {
        enabled on;
        listen 10080;
    }

    vhost __defaultVhost__ {
        min_latency     on;
        tcp_nodelay     on;

        hls {
            enabled         on;
            hls_path        ./objs/nginx/html;
            hls_fragment    5;
            hls_window      30;
        }

        http_remux {
            enabled     on;
            mount       [vhost]/[app]/[stream].flv;
        }

        rtc {
            enabled     on;
            rtmp_to_rtc on;
            rtc_to_rtmp on;
        }

        srt {
            enabled on;
        }
    }