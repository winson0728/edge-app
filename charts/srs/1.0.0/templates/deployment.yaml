apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srs.fullname" . }}
  labels:
    {{- include "srs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "srs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srs.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: srs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - ./objs/srs -c /usr/local/srs/conf/srs.conf
          ports:
            - name: rtmp
              containerPort: 1935
              protocol: TCP
            - name: api
              containerPort: 1985
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: webrtc
              containerPort: 8000
              protocol: UDP
            - name: srt
              containerPort: 10080
              protocol: UDP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: srs-config
              mountPath: /usr/local/srs/conf
            {{- if .Values.persistence.enabled }}
            - name: srs-data
              mountPath: /usr/local/srs/objs/nginx/html
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: srs-config
          configMap:
            name: {{ include "srs.fullname" . }}-config
        {{- if .Values.persistence.enabled }}
        - name: srs-data
          persistentVolumeClaim:
            claimName: {{ include "srs.fullname" . }}-pvc
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "srs.fullname" . }}-pvc
  labels:
    {{- include "srs.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}