# FreeRADIUS — Edge AI 平台預設值
# 由 tools/edgeai/build.py 依 tools/edgeai/catalog.yaml 產生；請改 catalog 後重產。
# 密碼／金鑰一律用 Secret（existingSecret 類參數），不要寫進 values。
nameOverride: ''
fullnameOverride: ''
imagePullSecrets: []
podSecurityContext: {}
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
networkPolicy:
  enabled: true
  allowedPorts:
  - port: 1812
    protocol: UDP
  - port: 1813
    protocol: UDP
  allowFrom: []
ingress:
  enabled: false
  className: ''
  host: ''
  tlsSecret: ''
  annotations: {}
  component: ''
  servicePort: ''
clients:
  existingSecret: ''
components:
  freeradius:
    enabled: true
    image:
      repository: docker.io/freeradius/freeradius-server
      tag: 3.2.10
      pullPolicy: IfNotPresent
    args:
    - -f
    - -l
    - stdout
    ports:
    - name: auth
      containerPort: 1812
      protocol: UDP
    - name: acct
      containerPort: 1813
      protocol: UDP
    service:
      enabled: true
      type: ClusterIP
      ports:
      - name: auth
        port: 1812
        protocol: UDP
      - name: acct
        port: 1813
        protocol: UDP
    secretMounts:
    - secretName: '{{ .Values.clients.existingSecret }}'
      mountPath: /etc/freeradius/clients.conf
      subPath: clients.conf
    config:
      mountPath: /etc/freeradius/sites-enabled
      files:
        default: |
          # 平台預設 site：只聽 IPv4（多數 K8s Pod 網路沒有 IPv6）。EAP-AKA′／sim-aaa-adapter 掛點之後在此擴充。
          server default {
          listen {
            type = auth
            ipaddr = *
            port = 0
          }
          listen {
            type = acct
            ipaddr = *
            port = 0
          }
          authorize {
            filter_username
            preprocess
            chap
            mschap
            suffix
            eap {
              ok = return
            }
            files
            expiration
            logintime
            pap
          }
          authenticate {
            Auth-Type PAP {
              pap
            }
            Auth-Type CHAP {
              chap
            }
            Auth-Type MS-CHAP {
              mschap
            }
            mschap
            eap
          }
          preacct {
            preprocess
            acct_unique
            suffix
            files
          }
          accounting {
            detail
            attr_filter.accounting_response
          }
          session {
          }
          post-auth {
            update {
              &reply: += &session-state:
            }
            remove_reply_message_if_eap
            Post-Auth-Type REJECT {
              attr_filter.access_reject
              eap
              remove_reply_message_if_eap
            }
          }
          pre-proxy {
          }
          post-proxy {
            eap
          }
          }
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
