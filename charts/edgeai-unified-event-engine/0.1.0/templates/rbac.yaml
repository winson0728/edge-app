{{- /* 骨架 chart：ServiceAccount 與 RBAC（controller／operator 用）。 */ -}}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eai.serviceAccountName" . }}
  labels:
    {{- include "eai.labels" . | nindent 4 }}
{{- end }}
{{- if and .Values.rbac.create .Values.rbac.rules }}
{{- $kind := ternary "ClusterRole" "Role" (default false .Values.rbac.clusterWide) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}
metadata:
  name: {{ include "eai.fullname" . }}
  {{- if eq $kind "Role" }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "eai.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}Binding
metadata:
  name: {{ include "eai.fullname" . }}
  {{- if eq $kind "Role" }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "eai.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kind }}
  name: {{ include "eai.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "eai.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
