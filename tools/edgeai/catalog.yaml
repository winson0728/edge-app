  questions:
    - {variable: existingSecret, label: Root 帳密 Secret, description: "含 rootUser、rootPassword", type: string, required: true, group: 認證}
    - {variable: persistence.size, label: PVC 大小, type: string, default: 50Gi, group: 儲存}
  ci:
    minio: {existingSecret: minio-root}

