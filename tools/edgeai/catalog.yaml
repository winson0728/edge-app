            config.yaml: |
              media:
                mediamtxApi: {{ .Values.workflow.mediamtxApi | quote }}
              inference:
                triton: {{ .Values.workflow.tritonUrl | quote }}
                vlm: {{ .Values.workflow.vlmUrl | quote }}
                vlmBudget: {maxConcurrent: {{ .Values.workflow.vlmMaxConcurrent }}}
              workers:
                dsImage: "{{ .Values.workers.ds.repository }}:{{ .Values.workers.ds.tag }}"     # DeepStream（Jetson）
                gstImage: "{{ .Values.workers.gst.repository }}:{{ .Values.workers.gst.tag }}"   # GStreamer＋Triton client（通用）
  crds:
    visionpipelines.vision.edgeai.internal.yaml: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: visionpipelines.vision.edgeai.internal
        annotations:
          edge-ai/stage: skeleton
      spec:
        group: vision.edgeai.internal
        scope: Namespaced
        names: {kind: VisionPipeline, listKind: VisionPipelineList, plural: visionpipelines, singular: visionpipeline, shortNames: [vp]}
        versions:
          - name: v1alpha1
            served: true
            storage: true
            subresources: {status: {}}
            schema:
              openAPIV3Schema:
                type: object
                properties:
                  spec:
                    type: object
                    description: 文件 §3.6：source、zones、detector、tracker、triggers、vlm（含 budget）、privacy、output
                    properties:
                      source: {type: object, x-kubernetes-preserve-unknown-fields: true}
                      zones: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                      detector: {type: object, x-kubernetes-preserve-unknown-fields: true}
                      tracker: {type: object, x-kubernetes-preserve-unknown-fields: true}
                      triggers: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                      vlm: {type: object, x-kubernetes-preserve-unknown-fields: true}
                      privacy: {type: object, x-kubernetes-preserve-unknown-fields: true}
                      output: {type: object, x-kubernetes-preserve-unknown-fields: true}
                  status:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
  questions:
    - {variable: components.app.image.repository, label: Controller 映像位置, type: string, required: true, group: 映像}
    - {variable: components.app.image.tag, label: Controller 映像 tag, type: string, required: true, group: 映像}
    - {variable: workers.ds.repository, label: ds-worker 映像（Jetson）, type: string, group: Worker}
    - {variable: workers.ds.tag, label: ds-worker tag, type: string, group: Worker}
    - {variable: workers.gst.repository, label: gst-worker 映像（通用）, type: string, group: Worker}
    - {variable: workers.gst.tag, label: gst-worker tag, type: string, group: Worker}
    - {variable: existingSecret, label: 秘密 Secret, description: "Camera 憑證另以 Secret 存放（ONVIF 探索後由 controller 建立）", type: string, group: 秘密}
    - {variable: workflow.vlmMaxConcurrent, label: VLM 最大併發, description: "VRAM 保護的硬性預算", type: int, default: 2, group: 推論}
  ci: *skelci
  readme: |
    介面：C8 Triton gRPC／vLLM OpenAI 相容 API。worker 由 controller 依節點類型動態建立 Deployment（因此 RBAC 只給本 namespace 的 deployments）。

- name: edgeai-model-release-controller
  kind: self
  skeleton: true
  version: 0.1.0
  appVersion: "0.1.0"
  display: model-release-controller
  pack: mlops
  categories: [Applications]
  tier: Hub
  arch: amd64, arm64
  license: 自研（專有）
  licenseRisk: 低
  description: MLflow → Triton 安全上架（按 GPU 世代建 TensorRT engine、benchmark Gate、cosign 簽章、shadow／promote／rollback）
  values:
    release:
      mlflowUrl: http://edgeai-mlflow.edgeai-mlops.svc:5000
      registry: harbor.example.com/edgeai-models
      runnerPools:
        orin: {nodeSelector: {edge-ai/gpu-gen: orin}}
        thor: {nodeSelector: {edge-ai/gpu-gen: thor}}
        rtx-pro: {nodeSelector: {edge-ai/gpu-gen: rtx-pro}}
        spark: {nodeSelector: {edge-ai/gpu-gen: spark}}
    rbac:
      create: true
      clusterWide: false
      rules:
        - {apiGroups: [batch], resources: [jobs], verbs: [get, list, watch, create, delete]}
        - {apiGroups: [""], resources: [pods, pods/log], verbs: [get, list, watch]}
        - {apiGroups: [""], resources: [configmaps, events], verbs: [get, list, watch, create, update, patch]}
    components:
      app:
        <<: *skel
        replicas: 1
        config:
          mountPath: /etc/edgeai
          files:
            config.yaml: |
              mlflow: {{ .Values.release.mlflowUrl | quote }}
              registry: {{ .Values.release.registry | quote }}     # 帳密走 Secret：REGISTRY_USER／REGISTRY_PASSWORD
              runnerPools: {{ toJson .Values.release.runnerPools }}
              gates:
                maxMapDropPercent: 1
  questions:
    - {variable: components.app.image.repository, label: 映像位置, type: string, required: true, group: 映像}
    - {variable: components.app.image.tag, label: 映像 tag, type: string, required: true, group: 映像}
    - {variable: existingSecret, label: 秘密 Secret, description: "REGISTRY_USER、REGISTRY_PASSWORD、COSIGN_KEY 等", type: string, group: 秘密}
    - {variable: release.mlflowUrl, label: MLflow 位置, type: string, default: "http://edgeai-mlflow.edgeai-mlops.svc:5000", group: 來源}
    - {variable: release.registry, label: 模型倉庫, type: string, default: harbor.example.com/edgeai-models, group: 來源}
  ci: *skelci
  readme: |
    介面：C10 以 K8s Job 派到各 GPU 世代的 runner（依 `edge-ai/gpu-gen` 節點標籤）。TensorRT engine 綁 compute capability，必須在目標世代上建置。

- name: edgeai-device-adapter
  kind: self
  skeleton: true
  version: 0.1.0
  appVersion: "0.1.0"
  display: device-adapter（範本）
  pack: iot
  categories: [Applications]
  tier: Node、Gateway
  arch: amd64, arm64
  license: 自研（專有）
  licenseRisk: 低
  description: device-adapter-sdk 產出的設備接入範本（Connector → MQTT 標準 telemetry；可選 EdgeX Device Service 出口）
  values:
    adapter:
      protocol: modbus-tcp
      target: 192.0.2.10:502
      pollIntervalSeconds: 5
      mqttUrl: mqtt://edgeai-mosquitto-mosquitto.edgeai-iot.svc:1883
      topicPrefix: edge/default/site-a/telemetry
    networkPolicy:
      allowedPorts: [{port: 9090}]
    components:
      app:
        <<: *skel
        replicas: 1
        config:
          mountPath: /etc/edgeai
          files:
            config.yaml: |
              connector:
                protocol: {{ .Values.adapter.protocol }}
                target: {{ .Values.adapter.target | quote }}
                pollIntervalSeconds: {{ .Values.adapter.pollIntervalSeconds }}
              output:
                mqtt: {{ .Values.adapter.mqttUrl | quote }}
                topicPrefix: {{ .Values.adapter.topicPrefix | quote }}
  questions:
    - {variable: components.app.image.repository, label: 映像位置, description: "由 device-adapter-sdk 建置的 adapter 映像", type: string, required: true, group: 映像}
    - {variable: components.app.image.tag, label: 映像 tag, type: string, required: true, group: 映像}
    - {variable: existingSecret, label: 秘密 Secret, description: "設備帳密、MQTT 帳密", type: string, group: 秘密}
    - {variable: adapter.protocol, label: 協定, type: string, default: modbus-tcp, group: 設備}
    - {variable: adapter.target, label: 設備位址, type: string, default: "192.0.2.10:502", group: 設備}
    - {variable: adapter.topicPrefix, label: MQTT topic 前綴, type: string, default: edge/default/site-a/telemetry, group: 輸出}
  ci: *skelci
  readme: |
    每種設備一個 release（例如 `plc-line1`、`cpe-vendor-x`）。之後 SDK 會直接產出 app-pack，本 chart 是其中 `chart/` 的範本。

- name: edgeai-portal-ui
  kind: self
  skeleton: true
  version: 0.1.0
  appVersion: "0.1.0"
  display: edge-portal-ui（EdgeOne Console）
  pack: platform
  categories: [Applications]
  tier: Hub
  arch: amd64, arm64
  license: 自研（專有）
  licenseRisk: 低
  description: EdgeOne Console（React UI＋Go BFF；聚合各模組 Admin API、Keycloak OIDC、嵌入 Grafana）
  values:
    portal:
      oidcIssuer: https://keycloak.example.com/realms/edge-ai
      oidcClientId: edge-portal
      grafanaUrl: http://edgeai-grafana.edgeai-observability.svc
    networkPolicy:
      allowedPorts: [{port: 8080}]
    ingress: {enabled: false, component: ui, servicePort: http}
    components:
      ui:
        <<: *skel
        replicas: 1
        envFrom: []
        ports: [{name: http, containerPort: 8080}]
        service: {enabled: true, type: ClusterIP, ports: [{name: http, port: 8080}]}
        livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 20}
        readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
        config: null
      bff:
        <<: *skel
        replicas: 1
        config:
          mountPath: /etc/edgeai
          files:
            config.yaml: |
              oidc:
                issuer: {{ .Values.portal.oidcIssuer | quote }}
                clientId: {{ .Values.portal.oidcClientId | quote }}   # client secret 走 Secret：OIDC_CLIENT_SECRET
              grafana: {{ .Values.portal.grafanaUrl | quote }}
              upstreams:
                accessPolicy: http://edgeai-access-policy-service-app.edgeai-access.svc:8080
                simAaa: http://edgeai-sim-aaa-adapter-app.edgeai-access.svc:8080
                catalog: http://edgeai-app-catalog-controller-app.edgeai-platform.svc:8080
                events: http://edgeai-unified-event-engine-app.edgeai-platform.svc:8080
                ptt: http://edgeai-ptt-gateway-app.edgeai-voice.svc:8080
                audit: http://edgeai-audit-service-app.edgeai-platform.svc:8080
  questions:
    - {variable: components.ui.image.repository, label: UI 映像位置, type: string, required: true, group: 映像}
    - {variable: components.ui.image.tag, label: UI 映像 tag, type: string, required: true, group: 映像}
    - {variable: components.bff.image.repository, label: BFF 映像位置, type: string, required: true, group: 映像}
    - {variable: components.bff.image.tag, label: BFF 映像 tag, type: string, required: true, group: 映像}
    - {variable: existingSecret, label: 秘密 Secret, description: "OIDC_CLIENT_SECRET、SESSION_KEY", type: string, group: 秘密}
    - {variable: portal.oidcIssuer, label: OIDC Issuer, type: string, default: "https://keycloak.example.com/realms/edge-ai", group: 登入}
    - {variable: ingress.enabled, label: 啟用 Ingress, type: boolean, default: false, group: 網路, show_subquestion_if: true, subquestions: [{variable: ingress.host, label: 主機名稱, type: hostname}, {variable: ingress.tlsSecret, label: TLS Secret, type: string}]}
  ci:
    components:
      ui: {image: {repository: registry.example/edgeai/portal-ui, tag: 0.1.0}}
      bff: {image: {repository: registry.example/edgeai/portal-bff, tag: 0.1.0}}
  readme: |
    UI 只是殼：每頁只消費既有模組的 Admin API（文件 §3.9、R18）。BFF 的 upstreams 預設指向各骨架 chart 用預設 release 名稱安裝後的 Service。

- name: edgeai-audit-service
  kind: self
  skeleton: true
  version: 0.1.0
  appVersion: "0.1.0"
  display: edge-audit-service
  pack: platform
  categories: [Security]
  tier: Hub
  arch: amd64, arm64
  license: 自研（專有）
  licenseRisk: 低
  description: 稽核服務（append-only 雜湊鏈、每日 anchor、四維查詢、簽章匯出、保留政策）
  values:
    audit:
      databaseHost: pg-rw.edgeai-platform.svc
      anchorS3Url: http://edgeai-seaweedfs-s3.edgeai-platform.svc:8333/audit-anchors
      retentionDays: 365
    networkPolicy:
      allowedPorts: [{port: 8080}]
    components:
      app:
        <<: *skel
        replicas: 1
        persistence: {enabled: true, mountPath: /var/spool/edgeai-audit, size: 5Gi}
        config:
          mountPath: /etc/edgeai
          files:
            config.yaml: |
              store:
                database: {{ .Values.audit.databaseHost | quote }}   # 帳密走 Secret：DB_USER／DB_PASSWORD
              anchor:
                s3: {{ .Values.audit.anchorS3Url | quote }}           # 憑證走 Secret：S3_ACCESS_KEY／S3_SECRET_KEY
                schedule: daily
              retentionDays: {{ .Values.audit.retentionDays }}
              spool: /var/spool/edgeai-audit
  questions:
    - {variable: components.app.image.repository, label: 映像位置, type: string, required: true, group: 映像}
    - {variable: components.app.image.tag, label: 映像 tag, type: string, required: true, group: 映像}
    - {variable: existingSecret, label: 秘密 Secret, description: "DB_USER、DB_PASSWORD、S3_ACCESS_KEY、S3_SECRET_KEY", type: string, group: 秘密}
    - {variable: audit.retentionDays, label: 保留天數, type: int, default: 365, group: 稽核}
    - {variable: components.app.persistence.enabled, label: 本地 spool 持久化（PVC）, description: "斷線時緩衝稽核事件，建議開", type: boolean, default: true, group: 儲存}
  ci: *skelci
  readme: |
    介面：C11 所有模組經 telemetry-client 非同步送入（MQTT／HTTP），稽核不可阻塞主流程；本地 spool 斷線緩衝。
