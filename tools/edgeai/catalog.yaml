    - {variable: persistence.size, label: PVC 大小, type: string, default: 10Gi, group: 儲存}
    - {variable: ingress.enabled, label: 啟用 Ingress, type: boolean, default: false, group: 網路}
  ci:
    gitea: {gitea: {admin: {existingSecret: gitea-admin}}}
  readme: |
    預設 SQLite＋記憶體 cache（單站 Hub 夠用、少一個資料庫要維運）；要 HA 時改開上游的 `postgresql-ha`／`valkey-cluster` 或接 CloudNativePG。

