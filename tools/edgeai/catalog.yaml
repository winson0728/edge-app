- name: edgeai-gitea
  kind: wrapper
  version: 0.1.0
  display: Gitea
  pack: platform
  categories: [Repository]
  tier: Hub
  arch: amd64, arm64
  license: MIT
  licenseRisk: 低
  upstream: {name: gitea, version: 12.7.0, repository: https://dl.gitea.com/charts/, home: https://gitea.com, note: "官方 chart"}
  description: Gitea（GitOps values repo，edge-app-catalog-controller 寫入）
  values:
    postgresql-ha: {enabled: false}
    postgresql: {enabled: false}
    valkey-cluster: {enabled: false}
    valkey: {enabled: false}
    gitea:
      admin: {existingSecret: ""}
      config:
        database: {DB_TYPE: sqlite3}
        session: {PROVIDER: memory}
        cache: {ADAPTER: memory}
        queue: {TYPE: level}
    persistence: {enabled: true, size: 10Gi}
  validate:
    - {path: gitea.gitea.admin.existingSecret, msg: "gitea.gitea.admin.existingSecret 必填（含 username／password，避免上游預設管理者密碼）"}
