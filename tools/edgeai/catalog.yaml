- name: edgeai-loki
  kind: wrapper
  version: 0.1.0
  display: Loki（AGPL）
  pack: observe
  categories: [Monitoring]
  tier: Hub
  arch: amd64, arm64
  license: AGPL-3.0
  licenseRisk: 中
  licenseNote: 同 Grafana；替代方案 edgeai-victoria（VictoriaLogs，Apache-2.0）。
  upstream: {name: loki, version: 7.7.0, repository: https://grafana.github.io/helm-charts, home: https://grafana.com/oss/loki/, note: "官方 chart"}
  description: Loki 日誌（SingleBinary＋filesystem，單站 Hub）
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig: {replication_factor: 1}
      storage: {type: filesystem}
      schemaConfig:
        configs:
          - {from: "2024-04-01", store: tsdb, object_store: filesystem, schema: v13, index: {prefix: loki_index_, period: 24h}}
    singleBinary: {replicas: 1}
    read: {replicas: 0}
    write: {replicas: 0}
    backend: {replicas: 0}
    chunksCache: {enabled: false}
    resultsCache: {enabled: false}
    lokiCanary: {enabled: false}
    test: {enabled: false}
  questions:
    - {variable: singleBinary.persistence.size, label: PVC 大小, type: string, default: 10Gi, group: 儲存}

